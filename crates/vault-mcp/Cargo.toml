[package]
name = "vault-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# 外部の依存は serde_json だけ。ツールの受付口（vault-core）と MCP の層（mcp-proto）をつなぐ。
# ログの1行と panic の知らせは safe-log。
[dependencies]
mcp-proto = { path = "../mcp-proto" }
safe-log = { path = "../safe-log" }
serde_json = "1"
vault-core = { path = "../vault-core" }

[features]
# テストだけ：環境変数 VAULT_MCP_TEST_PANIC_TOOL にツールの名前を入れると、そのツールの呼び出しで panic する。
# 配布のバイナリ（cargo build --release）には入れない。結合テストからだけ、下の dev-dependencies で有効にする。
test-panic = []

[dev-dependencies]
vault-mcp = { path = ".", features = ["test-panic"] }
# テストだけ：vault-core の test_support（好きなコード・文・印のエラーを作る）を使う。配布のバイナリには入らない。
vault-core = { path = "../vault-core", features = ["test-support"] }
