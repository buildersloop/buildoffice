[package]
name = "os-sys"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# 依存はない（外部のクレートも、windows-sys も、ワークスペースのクレートも使わない）。
# OS の関数の宣言は src/win/ffi.rs に自分で書く。unsafe を書いてよいのは、このクレートと vault-ffi だけ。

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# unsafe のブロックごとに `// SAFETY:` を書き、1つのブロックに unsafe の操作を1つだけ置く。
[lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
