# ワークスペースの構成：crates/ の下に 1 クレートずつ（vault-core・vault-mcp・vault-ffi・mcp-proto・json-guard・os-sys）。
# license は AGPL-3.0-only（2026-11-17 決定。各クレートは license.workspace で受け継ぐ）。
# [profile.release] に panic = "abort" を書かない（FFI の catch_unwind を効かせるため）。

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-only"
publish = false
