name: vault_app
description: "保管庫のファイルブラウザ（Phase 0。Windows）。"
publish_to: 'none'
# 配る版（X.Y.Z。+ のビルド番号は付けない＝exe の版の情報は X.Y.Z.0）。根の Cargo.toml の
# [workspace.package] の version と同じにする（scripts/build-release.sh は違えば止まる）。
version: 0.2.0

environment:
  sdk: ^3.10.7

# 依存は SDK に入っているものだけ：dart:ffi・dart:isolate・flutter・flutter_test。
# package:ffi・ffigen・flutter_rust_bridge は使わない。cupertino_icons・flutter_lints は外した。
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
